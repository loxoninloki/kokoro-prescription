name: Verify app build

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/kokoro-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test -- --watch=false --runInBand
        env:
          CI: 'true'
      - name: Build for GitHub Pages
        run: npm run build
        env:
          CI: 'true'
          PUBLIC_URL: /kokoro-prescription
